    <rect x="150" y="190" width="90" height="18" rx="4" fill="#0A2472"/>
    <rect x="620" y="194" width="56" height="10" rx="5" fill="#9aa6c6"/><rect x="690" y="194" width="56" height="10" rx="5" fill="#9aa6c6"/><rect x="760" y="194" width="56" height="10" rx="5" fill="#9aa6c6"/>
    <rect x="850" y="186" width="120" height="28" rx="14" fill="#1E90FF"/>
