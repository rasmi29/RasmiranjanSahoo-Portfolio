    <g fill="#161621" stroke="#2a2a3a">
      <rect x="1056" y="470" width="418" height="56" rx="10"/>
      <rect x="1056" y="536" width="418" height="56" rx="10"/>
      <rect x="1056" y="602" width="418" height="56" rx="10"/>
