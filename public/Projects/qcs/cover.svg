    <g fill="#7c5cff" fill-opacity="0.45"><rect x="1070" y="482" width="32" height="32" rx="8"/><rect x="1070" y="548" width="32" height="32" rx="8"/><rect x="1070" y="614" width="32" height="32" rx="8"/><rect x="1070" y="680" width="32" height="32" rx="8"/></g>
    <g fill="#c9c8d8"><rect x="1116" y="488" width="170" height="10" rx="5"/><rect x="1116" y="554" width="140" height="10" rx="5"/><rect x="1116" y="620" width="190" height="10" rx="5"/><rect x="1116" y="686" width="150" height="10" rx="5"/></g>
    <g fill="#55556e"><rect x="1116" y="504" width="110" height="8" rx="4"/><rect x="1116" y="570" width="130" height="8" rx="4"/><rect x="1116" y="636" width="90" height="8" rx="4"/><rect x="1116" y="702" width="120" height="8" rx="4"/></g>
