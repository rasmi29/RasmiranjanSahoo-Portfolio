    <g fill="#1E90FF" fill-opacity="0.18"><rect x="172" y="512" width="44" height="44" rx="10"/><rect x="453" y="512" width="44" height="44" rx="10"/><rect x="734" y="512" width="44" height="44" rx="10"/></g>
    <g fill="#0A2472"><rect x="172" y="574" width="150" height="14" rx="5"/><rect x="453" y="574" width="170" height="14" rx="5"/><rect x="734" y="574" width="140" height="14" rx="5"/></g>
    <g fill="#9aa6c6"><rect x="172" y="602" width="200" height="9" rx="4.5"/><rect x="172" y="620" width="180" height="9" rx="4.5"/><rect x="453" y="602" width="200" height="9" rx="4.5"/><rect x="453" y="620" width="160" height="9" rx="4.5"/><rect x="734" y="602" width="200" height="9" rx="4.5"/><rect x="734" y="620" width="190" height="9" rx="4.5"/></g>
  </g>

